<title id="title">Hellemyr — tree, children and supporting hands</title>
<desc id="desc">A simple green tree above three connected stick figures: a child in a wheelchair with an orange wheel between two standing children. Two cupped hands support the group. Flat colors on a square cream background.</desc>
